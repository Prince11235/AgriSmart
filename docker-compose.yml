version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: agrismart-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: agrismart-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/agrismart
      - JWT_SECRET=agrismart_super_secret_jwt_key_2026_production
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: agrismart-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo-data:
