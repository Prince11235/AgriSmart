name: AgriSmart CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install & Build Backend
        run: |
          cd backend
          npm install

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
